<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TFN Happy Hour Bingo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --berry:#88498f; --choc:#764F2E; --blue:#079CCC; --artifice:#eeece1;
  --silver:#C0C0C0; --mustard:#e4ac13; --white:#f8f8f8;
  --bg:var(--artifice); --ink:var(--choc); --tile:var(--white); --tile-line:var(--silver);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:var(--choc); --ink:var(--artifice); --tile:var(--white); --tile-line:var(--silver); }
}
:root[data-theme="dark"]{ --bg:var(--choc); --ink:var(--artifice); --tile:var(--white); --tile-line:var(--silver); }
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding:1.25rem 0.75rem 2.5rem}
header{display:flex;align-items:center;gap:1rem;margin-bottom:1rem}
.logo{flex:none;width:84px;height:88px;background:#fff;border-radius:6px;padding:6px;display:grid;place-items:center}
.logo img{max-width:100%;height:auto;display:block}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(1.9rem,6vw,2.8rem);line-height:1;margin:0;letter-spacing:.01em}
.sub{margin:.35rem 0 0;font-size:1rem;line-height:1.35}
.stripe{height:10px;background:var(--blue);border-top:5px solid var(--choc);margin:0 0 1rem;border-radius:2px}
:root[data-theme="dark"] .stripe{border-top-color:var(--artifice)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stripe{border-top-color:var(--artifice)}}
.letters,.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.letters div{text-align:center;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(1.6rem,6vw,2.4rem);line-height:1.1;color:var(--berry)}
:root[data-theme="dark"] .letters div{color:var(--mustard)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .letters div{color:var(--mustard)}}
.cell{appearance:none;font:inherit;cursor:pointer;background:var(--tile);color:var(--choc);border:2px solid var(--tile-line);border-radius:8px;aspect-ratio:1/1;padding:4px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(.62rem,2.3vw,.92rem);line-height:1.2;font-weight:500;position:relative;transition:transform .12s ease,background-color .15s ease}
.cell:active{transform:scale(.96)}
.cell:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.cell.marked{background:var(--berry);border-color:var(--berry);color:var(--white)}
.cell.free{background:var(--blue);border-color:var(--blue);color:var(--white);cursor:default;font-weight:600}
.cell.free strong{display:block;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.5em;letter-spacing:.04em}
.cell.win{background:var(--mustard);border-color:var(--mustard);color:var(--choc)}
.cell.marked::after{content:"";position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--mustard)}
.cell.win::after{background:var(--choc)}
.banner{margin:1rem 0 0;padding:.9rem 1rem;border-radius:8px;background:var(--mustard);color:var(--choc);font-weight:600;text-align:center;font-size:1.05rem;display:none}
.banner.show{display:block;animation:pop .35s ease-out}
.banner strong{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.6rem;display:block;line-height:1.1}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.banner.show{animation:none}.cell{transition:none}}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:.75rem;margin-top:1rem}
.legend{display:flex;gap:1rem;font-size:.9rem;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:.4rem}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
.count{font-weight:600}
button.reset{appearance:none;font:inherit;font-weight:600;cursor:pointer;background:transparent;color:var(--ink);border:2px solid currentColor;border-radius:999px;padding:.5rem 1.1rem}
button.reset:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.how{margin-top:1.25rem;font-size:.95rem;line-height:1.5;max-width:60ch}
footer{margin-top:1.5rem;font-size:.85rem;opacity:.85}
@media (max-width:420px){.cell{border-radius:6px;padding:3px}.letters,.grid{gap:4px}.logo{width:64px;height:68px}}
</style>
</head>

    <div>
      <h1>Happy Hour Bingo</h1>
      <p class="sub">AAP NCE 2026. Find someone who fits each square, then tap it.</p>
    </div>
  </header>
  <div class="stripe" aria-hidden="true"></div>
  <div class="letters" aria-hidden="true"><div>B</div><div>I</div><div>N</div><div>G</div><div>O</div></div>
  <div class="grid" id="grid" role="grid" aria-label="Bingo card"></div>
  <div class="banner" id="banner" role="status" aria-live="polite"><strong>Bingo!</strong>Come find the Terra Firma team to claim your prize.</div>
  <div class="bar">
    <div class="legend">
      <span><i class="sw" style="background:#079CCC"></i>Free</span>
      <span><i class="sw" style="background:#88498f"></i>Marked</span>
      <span><i class="sw" style="background:#e4ac13"></i>Bingo</span>
      <span class="count" id="count">1 of 25</span>
    </div>
    <button class="reset" id="reset" type="button">Reset card</button>
  </div>
  <p class="how">Get five in a row across, down, or diagonally. Your card saves on this device, so you can close the page and come back.</p>
</div>
<script>
const SQUARES = ["Has used an interpreter service professionally", "Has navigated US healthcare as a patient themselves", "Has lived in another country for 6+ months", "Has family members who use traditional medicine", "Researches immigrant or refugee health", "Parents or grandparents immigrated to the US", "Completed a global health rotation or fellowship", "Completed residency in a different country than med school", "Belongs to an ethnic physician society or caucus", "Works with refugee resettlement programs", "First-gen physician in their family", "Has attended an AAP NCE before", "FREE", "Went to medical school in another country", "Has translated for a family member at a doctor visit", "Speaks 2 or more languages other than English", "Has used telehealth to connect immigrant patients to care", "Has given grand rounds on a topic related to immigrant health", "Trained in medicine outside the US", "Has connected patients with legal aid or immigration resources", "Has served as a cultural broker for a patient family", "Has family in more than 2 countries", "Has practiced medicine in another country", "Has co-authored research with international collaborators", "Changed specialty or career path after immigrating"];
const KEY = "tfn-bingo-nce26";
const grid = document.getElementById("grid");
let marked = new Set([12]);
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (Array.isArray(s)) { marked = new Set(s); marked.add(12); } } catch(e){}
const LINES = [];
for (let r=0;r<5;r++) LINES.push([0,1,2,3,4].map(c=>r*5+c));
for (let c=0;c<5;c++) LINES.push([0,1,2,3,4].map(r=>r*5+c));
LINES.push([0,6,12,18,24],[4,8,12,16,20]);
const cells = SQUARES.map((t,i)=>{
  const b = document.createElement("button");
  b.type="button"; b.className="cell"; b.setAttribute("role","gridcell");
  if (i===12){ b.classList.add("free"); b.innerHTML="<span><strong>FREE</strong>You work in immigrant health!</span>"; b.setAttribute("aria-label","Free square"); b.disabled=false; }
  else { b.textContent=t; b.addEventListener("click",()=>{ marked.has(i)?marked.delete(i):marked.add(i); render(); save(); }); }
  grid.appendChild(b); return b;
});
let hadBingo = false;
function render(){
  const win = new Set();
  LINES.forEach(l=>{ if(l.every(i=>marked.has(i))) l.forEach(i=>win.add(i)); });
  cells.forEach((c,i)=>{
    if(i===12){ c.classList.toggle("win",win.has(i)); return; }
    c.classList.toggle("marked",marked.has(i)&&!win.has(i));
    c.classList.toggle("win",win.has(i));
    c.setAttribute("aria-pressed",marked.has(i));
  });
  document.getElementById("count").textContent = marked.size+" of 25";
  const b=document.getElementById("banner"), has=win.size>0;
  if(has && !hadBingo){ b.classList.remove("show"); void b.offsetWidth; }
  b.classList.toggle("show",has); hadBingo=has;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify([...marked])); }catch(e){} }
document.getElementById("reset").addEventListener("click",()=>{ marked=new Set([12]); save(); render(); });
render();
</script>
